<!doctype html>
<html lang="fr">
  <head>
    <!--
      Marqueur Naive UI : la lib injecte son CSS runtime JUSTE AVANT cet élément.
      Il doit rester la toute première balise du <head> pour que les feuilles
      suivantes (Tailwind) l'emportent à spécificité égale. Ne pas déplacer.
    -->
    <meta name="naive-ui-style" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:"
    />
    <title>JTools</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
